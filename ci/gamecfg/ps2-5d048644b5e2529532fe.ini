# GT3 A-Spec PAL v2.00 (SCES-50294) — per-game profil pro NetherSX2 Switch.
# Klíč profilu = game.key z launcher diagu (build 82): ps2-5d048644b5e2529532fe
# (fingerprint ISO). Launcher ho načte storeLoad(g_game, gamecfg/<klíč>.ini)
# a na startu GT3 přepíše globální defaults.
#
# Obsah (dle PATCHES/gt3_0xB590CE04.ini, Nemotron):
#   vu1Instant=false      — VU1 musí počítat přesně (GT3)
#   FullVU0SyncHack=true  — sync hack pro GT3
#   VU*ClampMode=2        — Extra+Sign clamp
[EmuCore/Speedhacks]
vu1Instant = false

[EmuCore/Gamefixes]
FullVU0SyncHack = true

[EmuCore/CPU]
VU0ClampMode = 2
VU1ClampMode = 2