name: Depth Range Detector Build

on:
  push:
    branches: [ main, master, arena/** ]
    paths:
      - 'src/depth_range_detector.*'
      - 'CMakeLists.txt'
      - '.github/workflows/depth_range_detector.yml'
  pull_request:
    branches: [ main, master, arena/** ]
  workflow_dispatch:

jobs:
  build:
    name: Build Depth Range Detector
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download ReShade SDK v6.8.0
        run: |
          git clone --branch v6.8.0 --depth 1 https://github.com/crosire/reshade.git external/reshade

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DRESHADE_DIR=${{ github.workspace }}/external/reshade

      - name: Build
        run: cmake --build build --config Release

      - name: Create artifact
        run: |
          mkdir -p artifacts
          cp build/Release/depth_range_detector.addon64 artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: depth_range_detector
          path: artifacts/
          retention-days: 30
