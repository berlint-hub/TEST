name: build / NetherSX2.nro (launcher bundle)

# Úplnej build: jádra z APK + emulátor GL + romfs + launcher -> NetherSX2.nro
#
# Pravidlo tohohle workflow: YAML kroky jsou tupé. Runner je pouští přes
# `bash -e`, takže jakákoli logika za rourou (`cmd | tee log; rc=${PIPESTATUS[0]}`)
# se při neúspěchu prostě nevykoná a log zůstane ležet v /tmp. Log proto teče
# přímo do workspace (ci-bundle.log) a vyhodnocuje ho samostatnej krok.

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/bundle.yml"
      - "ci/**"

permissions:
  contents: write

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: NetherSX2.nro (GL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      CORE_TAG: main
      APK_TAG: "2.2n"

    steps:
      - uses: actions/checkout@v4

      - name: build
        run: bash ci/run.sh 2>&1 | tee ci-bundle.log || true

      - name: vyhodnocení
        if: always()
        run: bash ci/verdict.sh ci-bundle.log out/NetherSX2.nro out/NetherSX2_nx_gl.nro

      - name: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethersx2-nro-bundle
          path: |
            out/
            ci-bundle.log
          if-no-files-found: warn

  # Trvalej odkaz na samostatnej .nro. Vyžaduje Settings → Actions → General →
  # Workflow permissions → "Read and write permissions"; bez toho job jen
  # varuje a .nro zůstane dostupný jako artifact v jobu `bundle`.
  release:
    name: publikuj .nro jako release
    needs: bundle
    if: always() && needs.bundle.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nethersx2-nro-bundle
          path: dist

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          nro=$(find dist -name 'NetherSX2.nro' | head -1)
          if [ -z "$nro" ]; then
            echo "::error::artifact neobsahuje NetherSX2.nro"
            find dist -type f | head -5
            exit 1
          fi
          stat -c "::notice::publikuji %n = %s B" "$nro"
          cat > notes.md <<'EOF'
          Postaveno GitHub Actions z `NaGaa95/NetherSX2_nx` (`main`) + emulátorová jádra z release `Trixarian/NetherSX2-{patch,classic}@2.2n`.
          
          - **Renderer:** build obsahuje jen `NetherSX2_nx_gl.nro`, takže v launcheru nastav **Renderer = OpenGL**. Default je Vulkan a ten v tomhle buildu není.
          - **SD:** `sdmc:/switch/NetherSX2.nro`, vlastní BIOS do `sdmc:/switch/nethersx2/bios/`.
          - **Logy pro ladění:** `sdmc:/switch/nethersx2/nethersx2-mesa.log` a `sdmc:/switch/nethersx2/nethersx2-exception.log`.
          - Není ověřeno na hardwaru — jen že se to sestavilo a nalinkovalo.
          EOF
          # Job běží BEZ actions/checkout, teda gh musí dostat repozitář
          # explicitně — bez -R končí na "no git repository" a nejde to
          # poznat, dokud nevypíšeš stderr.
          tag="nro-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" \
            --title "NetherSX2.nro (CI, OpenGL)" --notes-file notes.md --prerelease "$nro" 2> /tmp/gherr
          rc=$?
          if [ "$rc" -eq 0 ]; then
            gh release view "$tag" -R "$GITHUB_REPOSITORY" --json url --jq '"::notice::DOWNLOAD " + .url'
          else
            echo "::error::gh release create rc=$rc"
            head -4 /tmp/gherr | sed 's/^/::error::/'
            echo "::warning::zatím stáhni artifact 'nethersx2-nro-bundle' z jobu bundle"
            exit 1
          fi
