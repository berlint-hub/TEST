name: build / NetherSX2.nro (launcher bundle)

# Úplnej build: jádra z APK + emulátor GL + romfs + launcher -> NetherSX2.nro
#
# Pravidlo tohohle workflow: YAML kroky jsou tupé. Runner je pouští přes
# `bash -e`, takže jakýkoli pokus vyhodnotit výsledek za rourou se prostě
# nevykoná a log zůstane ležet v /tmp. Log proto teče přímo do workspace
# (ci-bundle.log) a hodnotí ho samostatnej krok ci/verdict.sh.

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/bundle.yml"
      - "ci/**"

permissions:
  contents: write

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: NetherSX2.nro (GL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      CORE_TAG: main
      APK_TAG: "2.2n"

    steps:
      - uses: actions/checkout@v4

      - name: build
        run: bash ci/run.sh 2>&1 | tee ci-bundle.log || true

      - name: vyhodnocení
        if: always()
        run: bash ci/verdict.sh ci-bundle.log out/NetherSX2.nro out/NetherSX2_nx_gl.nro

      - name: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethersx2-nro-bundle
          path: |
            out/
            ci-bundle.log
          if-no-files-found: warn
