name: build

on:
  push:
    branches: [reshade-torch-addon]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyTorch (CPU) and CUDA runtime headers
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install nvidia-cuda-runtime-cu12

      - name: Locate dependency paths
        run: |
          $tp = & python -c "import torch, os; print(os.path.dirname(torch.__file__))"
          $sp = Split-Path $tp
          echo "TORCH_WIN_DIR=$tp" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CUDA_RT_INC=$sp\nvidia\cuda_runtime\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "Reshading torch dir: $tp"

      - name: Clone ReShade SDK
        run: |
          git clone --depth 1 --branch v6.8.0 https://github.com/crosire/reshade.git external/reshade
          git -C external/reshade submodule update --init --depth 1 deps/imgui

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DRESHADE_DIR="$env:GITHUB_WORKSPACE/external/reshade" `
            -DTORCH_DIR="$env:TORCH_WIN_DIR" `
            -DCUDA_RUNTIME_INCLUDE_DIR="$env:CUDA_RT_INC"

      - name: Build
        run: cmake --build build

      - name: Dump imports (temporary)
        if: always()
        run: |
          $obj = "build/CMakeFiles/reshade_torch.dir/src/torch_engine.cpp.obj"
          echo "--- all UNDEF caffe2/c10/torch/at_ symbols ---"
          dumpbin /nologo /symbols $obj | Select-String -Pattern 'UNDEF' | Select-String -Pattern 'caffe2|c10|torch|at_' | ForEach-Object { ($_ -replace '^.*External\s+\|\s*','SYM: ') } | Select-Object -First 30
          echo "--- disasm around first metadata use ---"
          dumpbin /nologo /disasm $obj > disasm.txt
          $n = (Select-String -Path disasm.txt -Pattern 'std_string_metadata' | Select-Object -First 1).LineNumber
          echo "match at disasm line: $n"
          Get-Content disasm.txt | Select-Object -Skip ($n - 45) -First 48

      - name: Upload add-on
        uses: actions/upload-artifact@v4
        with:
          name: reshade_torch
          path: build/reshade_torch.addon