name: build

on:
  push:
    branches: [reshade-torch-addon, arena/96bb4b4c-test]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyTorch (CUDA) and CUDA runtime headers
        run: |
          python -m pip install --upgrade pip
          # The CPU wheel cannot run the add-on: aten's CUDA hooks are a
          # registry (aten/src/ATen/detail/CUDAHooksInterface.cpp) that stays
          # empty unless torch_cuda.dll is loaded into the process, so every
          # device(kCUDA) call throws "Cannot initialize CUDA without
          # ATen_cuda library". A CUDA wheel is what ships torch_cuda.dll.
          # The cu*** indexes do not all carry every torch version, so fall
          # back through them instead of pinning one that may disappear.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cu130 || `
          python -m pip install torch --index-url https://download.pytorch.org/whl/cu128 || `
          python -m pip install torch --index-url https://download.pytorch.org/whl/cu126
          python -c "import torch,os;p=os.path.join(os.path.dirname(torch.__file__),'lib');print('CUDA libs:',[f for f in os.listdir(p) if 'cuda' in f][:6]);assert os.path.exists(os.path.join(p,'torch_cuda.dll')),'torch_cuda.dll missing - CPU wheel installed'"
          python -m pip install nvidia-cuda-runtime-cu12

      - name: Clone Vulkan headers
        run: |
          # The Vulkan headers are enough: vulkan-1.dll is loaded at runtime,
          # so neither the SDK install nor its import library is needed here.
          git clone --depth 1 --branch v1.4.365 https://github.com/KhronosGroup/Vulkan-Headers.git external/vulkan-headers

      - name: Locate dependency paths
        run: |
          $tp = & python -c "import torch, os; print(os.path.dirname(torch.__file__))"
          $sp = Split-Path $tp
          echo "TORCH_WIN_DIR=$tp" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CUDA_RT_INC=$sp\nvidia\cuda_runtime\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "Reshading torch dir: $tp"

      - name: Clone ReShade SDK
        run: |
          git clone --depth 1 --branch v6.8.0 https://github.com/crosire/reshade.git external/reshade
          git -C external/reshade submodule update --init --depth 1 deps/imgui

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DRESHADE_DIR="$env:GITHUB_WORKSPACE/external/reshade" `
            -DTORCH_DIR="$env:TORCH_WIN_DIR" `
            -DCUDA_RUNTIME_INCLUDE_DIR="$env:CUDA_RT_INC"

      - name: Build
        run: cmake --build build

      - name: Upload add-on
        uses: actions/upload-artifact@v4
        with:
          name: reshade_torch
          path: build/reshade_torch.addon64