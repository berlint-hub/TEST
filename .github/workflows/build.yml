name: build

on:
  push:
    branches: [reshade-torch-addon]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyTorch (CPU) and CUDA runtime headers
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install nvidia-cuda-runtime-cu12

      - name: Locate dependency paths
        run: |
          $sp = & python -c "import site; print(site.getsitepackages()[0])"
          echo "TORCH_WIN_DIR=$sp/torch" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CUDA_RT_INC=$sp/nvidia/cuda_runtime/include" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "Reshading torch dir: $sp/torch"

      - name: Clone ReShade SDK
        run: |
          git clone --depth 1 --branch v6.8.0 https://github.com/crosire/reshade.git external/reshade
          git -C external/reshade submodule update --init --depth 1 deps/imgui

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DRESHADE_DIR="$env:GITHUB_WORKSPACE/external/reshade" -DTORCH_DIR="$env:TORCH_WIN_DIR" -DCUDA_RUNTIME_INCLUDE_DIR="$env:CUDA_RT_INC" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload add-on
        uses: actions/upload-artifact@v4
        with:
          name: reshade_torch
          path: build/Release/reshade_torch.addon