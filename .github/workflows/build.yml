name: Build Depth Range Detector

on:
  push:
    branches: [ main, master, arena/** ]
  pull_request:
    branches: [ main, master, arena/** ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout kodu
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Stahnout ReShade SDK v6.8.0
      - name: Download ReShade SDK
        run: |
          git clone --branch v6.8.0 --depth 1 https://github.com/crosire/reshade.git external/reshade

      # 3. Instalace Visual Studio 2022
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 4. Konfigurace CMake
      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DRESHADE_DIR=${{ github.workspace }}/external/reshade

      # 5. Build
      - name: Build
        run: cmake --build build --config Release

      # 6. Vytvoreni artifactu
      - name: Create artifact
        run: |
          mkdir -p artifacts
          cp build/Release/depth_range_detector.addon64 artifacts/

      # 7. Nahraje artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: depth_range_detector
          path: artifacts/
          retention-days: 30

      # 8. Vytvoreni release (pouze pro main/master/arena branch)
      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/arena/')
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/depth_range_detector.addon64
          tag_name: v1.0.${{ github.run_number }}
          name: Depth Range Detector v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
