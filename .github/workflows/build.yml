name: build

on:
  push:
    branches: [reshade-torch-addon]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyTorch (CPU) and CUDA runtime headers
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install nvidia-cuda-runtime-cu12

      - name: Locate dependency paths
        run: |
          $tp = & python -c "import torch, os; print(os.path.dirname(torch.__file__))"
          $sp = Split-Path $tp
          echo "TORCH_WIN_DIR=$tp" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CUDA_RT_INC=$sp\nvidia\cuda_runtime\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "Reshading torch dir: $tp"

      - name: Clone ReShade SDK
        run: |
          git clone --depth 1 --branch v6.8.0 https://github.com/crosire/reshade.git external/reshade
          git -C external/reshade submodule update --init --depth 1 deps/imgui

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Diagnose DXGI headers (temporary)
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          echo "SDK: $($sdk.FullName)"
          $dx = Join-Path $sdk.FullName "um\dxgi1_3.h"
          echo "dxgi1_3.h exists: $(Test-Path $dx)"
          if (Test-Path $dx) {
            Get-Content $dx | Select-Object -First 70 | ForEach-Object { echo "DXGI13: $_" }
            echo "--- IDXGISwapChain3 refs ---"
            Select-String -Path $dx -Pattern 'IDXGISwapChain3' | Select-Object -First 5 | ForEach-Object { echo "DXGI13: $($_.LineNumber): $($_.Line)" }
          }
          echo "--- mini compile test ---"
          Set-Content -Path dxgi_test.cpp -Value "#include <dxgi1_3.h>`nIDXGISwapChain3 *g_p = nullptr;`nint main() { return g_p != nullptr; }`n"
          cl.exe /nologo /c dxgi_test.cpp
          echo "mini test exit: $LASTEXITCODE"

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DRESHADE_DIR="$env:GITHUB_WORKSPACE/external/reshade" `
            -DTORCH_DIR="$env:TORCH_WIN_DIR" `
            -DCUDA_RUNTIME_INCLUDE_DIR="$env:CUDA_RT_INC"

      - name: Build
        run: cmake --build build

      - name: Upload add-on
        uses: actions/upload-artifact@v4
        with:
          name: reshade_torch
          path: build/reshade_torch.addon