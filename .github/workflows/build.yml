name: Build Depth Range Detector

on:
  push:
    branches: [ main, master, arena/** ]
  pull_request:
    branches: [ main, master, arena/** ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download ReShade SDK v6.8.0 with submodules
        run: |
          git clone --branch v6.8.0 --depth 1 --recurse-submodules https://github.com/crosire/reshade.git external/reshade

      - name: Configure CMake with Visual Studio
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DRESHADE_DIR=${{ github.workspace }}/external/reshade

      - name: Build
        run: cmake --build build --config Release

      - name: Create artifact
        run: |
          mkdir -p artifacts
          cp build/Release/depth_range_detector.addon64 artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: depth_range_detector
          path: artifacts/
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/arena/')
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/depth_range_detector.addon64
          tag_name: v1.0.${{ github.run_number }}
          name: Depth Range Detector v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
