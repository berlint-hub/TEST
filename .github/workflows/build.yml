name: build

on:
  push:
    branches: [reshade-torch-addon]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyTorch (CPU) and CUDA runtime headers
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install nvidia-cuda-runtime-cu12

      - name: Locate dependency paths
        run: |
          $tp = & python -c "import torch, os; print(os.path.dirname(torch.__file__))"
          $sp = Split-Path $tp
          echo "TORCH_WIN_DIR=$tp" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CUDA_RT_INC=$sp\nvidia\cuda_runtime\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "Reshading torch dir: $tp"

      - name: Clone ReShade SDK
        run: |
          git clone --depth 1 --branch v6.8.0 https://github.com/crosire/reshade.git external/reshade
          git -C external/reshade submodule update --init --depth 1 deps/imgui

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DRESHADE_DIR="$env:GITHUB_WORKSPACE/external/reshade" `
            -DTORCH_DIR="$env:TORCH_WIN_DIR" `
            -DCUDA_RUNTIME_INCLUDE_DIR="$env:CUDA_RT_INC"

      - name: Build
        run: cmake --build build

      - name: Dump imports (temporary)
        if: always()
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $tp = $env:TORCH_WIN_DIR
          $inc = $env:CUDA_RT_INC
          $args = @('/nologo','/TP','/P',"/Fi$ws\PREPROCESSED.i",
            '-DImTextureID=ImU64','-DNOMINMAX','-DUNICODE','-DWIN32_LEAN_AND_MEAN',
            '-D_CRT_NONSTDC_NO_DEPRECATE','-D_CRT_SECURE_NO_WARNINGS','-D_UNICODE',
            '-Dreshade_torch_EXPORTS','-DWIN32','-D_WINDOWS','/EHsc','-std:c++20','/MD','/permissive-',
            "-I$ws\src","-I$ws\external\reshade\include","-I$ws\external\reshade\deps\imgui",
            "-I$tp\include","-I$tp\include\torch\csrc\api\include",
            "-I$ws\thirdparty\cuda_crt_shim","-I$inc",
            "$ws\src\torch_engine.cpp")
          & cl.exe $args
          echo "--- preprocess done, searching ---"
          $all = Select-String -Path "$ws\PREPROCESSED.i" -Pattern '_typeMetaData<std::string>'
          echo "typemetdata-string refs: $($all.Count)"
          $all | Select-Object -Skip 1 -First 6 | ForEach-Object {
            $n = $_.LineNumber
            echo "=== ref at .i line $n ==="
            Get-Content "$ws\PREPROCESSED.i" | Select-Object -Skip ($n - 4) -First 7 | ForEach-Object { ($_ -replace '^.*Z ',' ').Substring(0, [Math]::Min(220, ($_ -replace '^.*Z ',' ').Length)) }
          }

      - name: Upload add-on
        uses: actions/upload-artifact@v4
        with:
          name: reshade_torch
          path: build/reshade_torch.addon