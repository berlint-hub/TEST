name: build

on:
  push:
    branches: [reshade-torch-addon]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyTorch (CPU) and CUDA runtime headers
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install nvidia-cuda-runtime-cu12

      - name: Install Vulkan SDK
        run: |
          # Use a known working Vulkan SDK version
          $vulkan_version = "1.3.280.0"
          $installer_url = "https://sdk.lunarg.com/sdk/download/$vulkan_version/windows/VulkanSDK-$vulkan_version-Installer.exe"
          $installer_path = "$env:TEMP\VulkanSDK-Installer.exe"
          Write-Host "Downloading Vulkan SDK $vulkan_version..."
          Invoke-WebRequest -Uri $installer_url -OutFile $installer_path -UseBasicParsing
          Write-Host "Installing Vulkan SDK..."
          & $installer_path /S /D=C:\VulkanSDK
          # Find the installed SDK
          $vulkan_paths = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending
          if ($vulkan_paths.Count -gt 0) {
              $vulkan_sdk = $vulkan_paths[0].FullName
              echo "VULKAN_SDK=$vulkan_sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
              echo "VULKAN_INCLUDE=$vulkan_sdk\Include" | Out-File -FilePath $env:GITHUB_ENV -Append
              echo "VULKAN_LIB=$vulkan_sdk\Lib" | Out-File -FilePath $env:GITHUB_ENV -Append
              echo "Found Vulkan SDK at: $vulkan_sdk"
          } else {
              Write-Error "Could not find Vulkan SDK after installation"
              exit 1
          }

      - name: Locate dependency paths
        run: |
          $tp = & python -c "import torch, os; print(os.path.dirname(torch.__file__))"
          $sp = Split-Path $tp
          echo "TORCH_WIN_DIR=$tp" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CUDA_RT_INC=$sp\nvidia\cuda_runtime\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "Reshading torch dir: $tp"

      - name: Clone ReShade SDK
        run: |
          git clone --depth 1 --branch v6.8.0 https://github.com/crosire/reshade.git external/reshade
          git -C external/reshade submodule update --init --depth 1 deps/imgui

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DRESHADE_DIR="$env:GITHUB_WORKSPACE/external/reshade" `
            -DTORCH_DIR="$env:TORCH_WIN_DIR" `
            -DCUDA_RUNTIME_INCLUDE_DIR="$env:CUDA_RT_INC"

      - name: Build
        run: cmake --build build

      - name: Upload add-on
        uses: actions/upload-artifact@v4
        with:
          name: reshade_torch
          path: build/reshade_torch.addon64