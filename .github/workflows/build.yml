name: build / NetherSX2_nx (GL)

# Průleznej build NetherSX2_nx v GitHub Actions:
#   devkitPro image -> portlibs -> libsmb2+libusbhsfs -> make RENDERER=GL -> .nro -> draft release
#
# Záměrně se NEpoužívá build_all.sh: ten tvrdě abortuje bez libemucore.so
# z APK (4248 + 3668), které upstream nedistribuuje. Samotný `make` jádra
# nepotřebuje — loadují se až na zařízení.
#
# RENDERER=VK zatím ne: chce vulkan/{include,lib} s 23 statickými archivy.
# nxvk (Mesa fork) je v tomhle tvaru nevydává (jen libnvk.a + libnvk_support.a
# + libnvk_gl.a jako portlib) a nemá ani jeden release, takže je potřeba
# stavět Mesu v docker imageu `make image` a poskládat MESA_SDK_ROOT.
#
# Adresář se MUSÍ jmenovat NetherSX2_nx, protože Makefile má
#   TARGET := $(notdir $(CURDIR))
# jinak by output byl TEST.nro.

on:
  # GL emulátor: automatický build vypnutej, stačí spustit ručně.
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVKITPRO: /opt/devkitpro
  PORTLIBS: /opt/devkitpro/portlibs/switch
  CORE_TAG: main

jobs:
  emulator:
    name: NetherSX2_nx · RENDERER=GL
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: PATH pro devkitA64 (image ho v nelogin shellu nenastaví)
        run: |
          echo "$DEVKITPRO/devkitA64/bin" >> $GITHUB_PATH
          echo "$DEVKITPRO/tools/bin" >> $GITHUB_PATH
          echo "$DEVKITPRO/bin" >> $GITHUB_PATH

      - uses: actions/checkout@v4

      - name: ověř compiler a switch Rules
        run: |
          aarch64-none-elf-gcc --version | head -1 | bash ci/annotate.sh notice 1
          test -f "$DEVKITPRO/libnx/switch_rules" \
            && echo "::notice::switch_rules OK" || echo "::error::switch_rules CHYBÍ"
          test -f "$DEVKITPRO/cmake/Switch.cmake" \
            && echo "::notice::cmake Switch.cmake OK" || echo "::error::cmake/Switch.cmake CHYBÍ"

      - name: co nabízí devkitPro repo
        run: |
          set +e
          dkp-pacman -Sy --noconfirm > /tmp/sy.log 2>&1
          for p in devkitA64 switch-tools libnx \
                   switch-mesa switch-libdrm_nouveau switch-curl \
                   switch-sdl2 switch-sdl2_ttf switch-sdl2_image \
                   switch-zlib switch-zstd switch-expat switch-turbojpeg; do
            if dkp-pacman -Si "$p" > /dev/null 2>&1; then
              echo "::notice::$p: V REPO"
            else
              # "NENÍ V REPO" ≠ chyba: image už hotové portlibs obsahuje
              echo "::warning::$p: NENÍ V REPO (zkontroluj, jestli už není v image)"
            fi
          done

      - name: doinstaluj, co v image chybí
        run: |
          set +e
          GO=""
          for p in switch-mesa switch-libdrm_nouveau switch-curl switch-zlib; do
            dkp-pacman -Si "$p" >/dev/null 2>&1 && GO="$GO $p"
          done
          [ -z "$GO" ] && { echo "::notice::nic doinstalovávat"; exit 0; }
          echo "::notice::instaluji:$GO"
          dkp-pacman -S --noconfirm $GO > /tmp/inst.log 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then
            echo "::notice::install OK"
          else
            echo "::error::install rc=$rc"
            tail -15 /tmp/inst.log | bash ci/annotate.sh error 15
          fi
          # GL link potřebuje tahle čtyři + curl
          ls $PORTLIBS/lib/libEGL.a $PORTLIBS/lib/libGLESv2.a $PORTLIBS/lib/libglapi.a \
             $PORTLIBS/lib/libdrm_nouveau.a $PORTLIBS/lib/libcurl.a 2>&1 | bash ci/annotate.sh notice 8

      - name: stáhni upstream
        run: |
          set -e
          git clone --depth 1 --branch "$CORE_TAG" \
            https://github.com/NaGaa95/NetherSX2_nx.git NetherSX2_nx
          git -C NetherSX2_nx rev-parse --short HEAD | bash ci/annotate.sh notice 1

      - name: launcher/dependencies (libsmb2 + libusbhsfs)
        run: |
          set +e
          cmake -S NetherSX2_nx/launcher/dependencies \
                -B NetherSX2_nx/launcher/dependencies/build -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
                -DCMAKE_BUILD_TYPE=Release > /tmp/deps-conf.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::deps configure rc=$rc"
            grep -E "CMake Error|Could NOT find|FATAL" /tmp/deps-conf.log | bash ci/annotate.sh error 8
            exit $rc
          fi
          cmake --build NetherSX2_nx/launcher/dependencies/build --parallel "$(nproc)" \
            > /tmp/deps-build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::deps build rc=$rc"
            grep -E "error:|FAILED" /tmp/deps-build.log | bash ci/annotate.sh error 10
            tail -20 /tmp/deps-build.log | bash ci/annotate.sh error 20
            exit $rc
          fi
          echo "::notice::deps build OK ($(nproc) CPU)"
          ls -la NetherSX2_nx/launcher/dependencies/build/_deps/libsmb2-build/lib/libsmb2.a \
                 NetherSX2_nx/launcher/dependencies/build/_deps/libusbhsfs-build/liblibusbhsfs.a \
                 2>&1 | bash ci/annotate.sh notice 4

      - name: make RENDERER=GL
        run: |
          set +e
          make -C NetherSX2_nx -j"$(nproc)" RENDERER=GL > /tmp/gl.log 2>&1
          rc=$?
          mkdir -p out
          if [ $rc -eq 0 ] && [ -f NetherSX2_nx/NetherSX2_nx.nro ]; then
            cp -f NetherSX2_nx/NetherSX2_nx.nro out/NetherSX2_nx_gl.nro
            stat -c '::notice::GL BUILD OK — .nro = %s B' out/NetherSX2_nx_gl.nro
            echo "::notice::SHA1 $(sha1sum out/NetherSX2_nx_gl.nro | cut -c1-40)"
          else
            echo "::error::GL BUILD SELHAL rc=$rc"
            grep -E "fatal error:|error:|cannot find -l|No such file" /tmp/gl.log \
              | sort -u | bash ci/annotate.sh error 14
            exit 1
          fi
          cp /tmp/gl.log ci-gl.log 2>/dev/null
          cp /tmp/deps-build.log ci-deps.log 2>/dev/null

      - name: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethersx2-nx-gl
          path: |
            out/
            ci-gl.log
            ci-deps.log
          if-no-files-found: warn

  release:
    name: publikuj .nro jako draft release
    needs: emulator
    if: always() && needs.emulator.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nethersx2-nx-gl
          path: dist

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "=== co artifact observed ==="
          find dist -type f | head -10
          nro=$(find dist -name '*.nro' | head -1)
          if [ -z "$nro" ]; then
            echo "::error::v artifactu není žádné .nro — viz jobs"
            exit 1
          fi
          stat -c '::notice::publikuji %n (%s B)' "$nro"
          cp -f "$nro" ./NetherSX2_nx_gl.nro
          log=$(find dist -name 'ci-gl.log' | head -1)
          tag="ci-gl-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$tag" \
            --title "NetherSX2_nx · GL · CI $tag" \
            --notes "Nazdobeno GitHub Actions z NaGaa95/NetherSX2_nx (\`make RENDERER=GL\`, devkitA64 + switch-mesa). Emulátorové core \`libemucore.so\` (APK 4248/3668) ani BIOS nejsou součástí — loaduje se na zařízení z \`/switch/nethersx2/\`." \
            --draft ./NetherSX2_nx_gl.nro "$log"
          rc=$?
          if [ $rc -eq 0 ]; then
            echo "::notice::DRAFT RELEASE: $tag"
          else
            # Release není nutnost — artifact nahoře obsahuje stejné .nro.
            # Vypadává to proto, že repozitář má Settings → Actions → General →
            # Workflow permissions = read-only, takže GITHUB_TOKEN nesmí psát.
            echo "::warning::gh release create rc=$rc — artifact 'nethersx2-nx-gl' má týž .nro, stáhni ho z runu"
            echo "::warning::chceš-li release: Settings → Actions → General → Workflow permissions → Read and write"
          fi
