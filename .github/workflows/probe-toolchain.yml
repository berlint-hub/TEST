name: probe / devkitPro toolchain

# Ověření, že na tomhle repozáři umíme:
#  1) stáhnout devkitPro Docker image, 2) použít devkitA64 na Switch kód,
#  3) zabalit .nro, 4) mít vše, co chce build_all.sh z NetherSX2_nx.

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVKITPRO: /opt/devkitpro
  DEVKITA64: /opt/devkitpro/devkitA64
  PORTLIBS: /opt/devkitpro/portlibs/switch

jobs:
  toolchain:
    name: devkitA64 + hello .nro
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: co máme k dispozici
        run: |
          set -euo pipefail
          echo "== compiler =="
          aarch64-none-elf-gcc --version | head -1
          aarch64-none-elf-g++ --version | head -1
          aarch64-none-elf-ld --version  | head -1
          echo "== nástroje =="
          for t in make cmake ninja python3 git curl; do
            printf '%-9s ' "$t"; command -v "$t" >/dev/null && ("$t" --version | head -1) || echo "CHYBÍ"
          done
          echo "== elf2nro / nacpTool =="
          ls "$DEVKITPRO/tools/bin" | sort | tr '\n' ' '; echo
          echo "== nainstalované balíčky (devkitPro) =="
          dkp-pacman -Q | grep -Ei 'switch|devkit|libnx|mesa|sdl|curl|zstd|expat|elfutils' | sort || true
          echo "== portlibs headers =="
          ls "$PORTLIBS/include" 2>/dev/null | head -30 || echo "žádné portlibs"
          echo "== libnx =="
          ls "$DEVKITPRO/libnx" | tr '\n' ' '; echo

      - name: zkompilovat hello pro Switch (přes switch_rules jako NetherSX2_nx)
        run: |
          set -euo pipefail
          make -C probe/hello -j"$(nproc)"
          ls -la probe/hello/
          file probe/hello/Hello.nro
          echo "-- velikost --"; stat -c '%s B' probe/hello/Hello.nro

      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-hello-nro
          path: probe/hello/Hello.nro
          if-no-files-found: error
