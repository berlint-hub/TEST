name: build / VK (nxvk Mesa -> NetherSX2_nx)

# Dva kroky, který si nemůžeš dovolit dělat ručně pokaždý:
#
#   mesa   = postavit nxvk (Mesa NVK pro Switch) v Docker image a vyndat z
#            něj plochý vulkan/{include,lib} SDK (23 archivů)
#   bundle = postavit NetherSX2_n S OBĚMA renderama -> NetherSX2.nro, kde
#            funguje i Vulkan (a tím LSFG frame generation)
#
# Job `mesa` MUSÍ běžet na hostiteli, ne v container: potřebuje Docker.
# Je drahanej — private repozitář má měsíční kvótu runner minut.

on:
  # Pozor: `push:` tu nesmí být dvakrát — YAML by druhý blok přepsal ten
  # první a trigger by zmizel bez jakýkoliv chyby. Main tu záměrně není:
  # každej build žere ~15 min runner minut z měsíční kvóty privátního repa.
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/mesa-vk.yml"
      - "ci/**"
  workflow_dispatch:
    inputs:
      reuse_sdk_run:
        description: "ID runu, ze kterýho se má stáhnout artifact mesa-sdk (ušetří ~14 minut Mesa buildu). Prázdné = buildni Mesu znovu."
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: mesa-vk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mesa:
    name: nxvk / Mesa NVK SDK
    # Drahá etapa (~14 min, 4,2 GB Docker image). Pouští se jen na explicitní
    # dispatch bez reuse_sdk_run; push a PR berou SDK z předchozího runu.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reuse_sdk_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NXVK_TAG: switch

    steps:
      - uses: actions/checkout@v4

      - name: build SDK
        run: bash ci/build-mesa-sdk.sh 2>&1 | tee ci-mesa.log

      - name: vyhodnocení
        if: always()
        run: bash ci/verdict.sh ci-mesa.log mesa-sdk/lib/libnvk.a

      - name: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # JEDNA cesta — víc cest v `path:` znamená, že se do artifactu
          # uloží i samotný prefix (mesa-sdk/mesa-sdk/lib) a druhý job
          # pak nic nenajde.
          name: mesa-sdk
          path: mesa-sdk
          if-no-files-found: error

  bundle:
    name: NetherSX2.nro (GL + VK)
    needs: mesa
    if: always() && (needs.mesa.result == 'success' || needs.mesa.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      CORE_TAG: main
      APK_TAG: "2.2n"
      VULKAN_SDK_DIR: ${{ github.workspace }}/mesa-sdk

    steps:
      - uses: actions/checkout@v4

      # Dva kanály, jak k SDK přijít: jestli ho stavěl mesa job *tohohle* runu,
      # vezmeme ho jako běžnej artifact. Jinak (push/PR/reuse) si ho vytáhneme
      # z předchozího runu přes `gh run download` -- nepotřebujeme na to
      # workflow_dispatch práva, jen actions: read.
      - name: stáhni Mesa SDK (z tohohle runu)
        if: ${{ needs.mesa.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: mesa-sdk
          path: mesa-sdk

      - name: stáhni Mesa SDK z předchozího runu
        if: ${{ needs.mesa.result != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.inputs.reuse_sdk_run }}
        run: |
          set -uo pipefail
          # Když Mesa job neběžel (push/PR/reuse), vezmi 23 archivů z
          # posledníhodoncenejho runu tedhlety workflowu. `gh run download`
          # umí cizí run a stacilo k tomu actions: read.
          if [ -z "${RUN_ID:-}" ]; then
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=30" \
              --jq '.workflow_runs[]
                    | select(.status == "completed" and (.name | test("VK")))
                    | .id' 2>/dev/null | head -1 || true)
          fi
          echo "zdroj SDK: run ${RUN_ID:-neni-znamej}"
          ok=0
          if [ -n "${RUN_ID:-}" ]; then
            if gh run download "$RUN_ID" -n mesa-sdk -D mesa-sdk; then ok=1; fi
          fi
          # pipefail + glob do prazdnyho adresare by inac ukoncil step chybou
          set +o pipefail
          n=$(find mesa-sdk -name '*.a' 2>/dev/null | wc -l)
          sz=$(du -sh mesa-sdk 2>/dev/null | cut -f1)
          if [ "$ok" = 1 ]; then
            echo "::notice::mesa-sdk staženo z runu ${RUN_ID}: ${n} archivů, ${sz:-?}"
          else
            echo "::warning::mesa-sdk není k dispozici (run ${RUN_ID:-?}) — bundle pojede GL-only"
          fi
          exit 0

      - name: co jsme dostali
        run: |
          set +e
          ls mesa-sdk/lib 2>/dev/null | wc -l | xargs -I@ echo "::notice::mesa-sdk/lib: @ archivů"
          test -f mesa-sdk/lib/libnvk.a && echo "::notice::libnvk.a přítomen" || echo "::error::libnvk.a chybí"
          test -f mesa-sdk/include/vulkan/vulkan_core.h && echo "::notice::vulkan_core.h přítomen" || echo "::error::vulkan_core.h chybí"
          du -sh mesa-sdk 2>/dev/null | xargs -I@ echo "::notice::velikost SDK @"

      - name: build
        run: bash ci/run.sh 2>&1 | tee ci-bundle.log

      - name: vyhodnocení
        if: always()
        run: bash ci/verdict.sh ci-bundle.log out/NetherSX2.nro out/NetherSX2_nx_gl.nro out/NetherSX2_nx_vk.nro

      - name: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethersx2-nro-vk-bundle
          path: |
            out/
            ci-bundle.log
          if-no-files-found: warn
